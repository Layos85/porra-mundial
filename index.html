<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B1A1F">
<title>Porra del Mundial 2026</title>
</head>
<body>
<style>
  :root{
    --bg:#0B1A1F; --bg2:#0F2228; --card:#13282E; --card2:#183239;
    --line:#234048; --ink:#EAF2EF; --muted:#8CA6A4;
    --gold:#F5B83D; --gold-deep:#C9912A; --gold-ink:#3A2A06;
    --fav:#4FD1B5; --even:#F0A23C; --surprise:#FF5470;
    --good:#3DDC97; --bad:#FF6B7E;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #15323a 0%, transparent 60%),
      linear-gradient(180deg,#0B1A1F 0%, #0A161A 100%);
    background-attachment:fixed; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .phone{max-width:460px; margin:0 auto; padding:0 14px 96px}

  /* top bar */
  .top{
    position:sticky; top:0; z-index:20; margin:0 -14px; padding:14px 16px 12px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(180deg, rgba(11,26,31,.96), rgba(11,26,31,.82));
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .crest{
    width:40px; height:40px; border-radius:12px; flex:none; display:grid; place-items:center;
    font-size:1.25rem; background:linear-gradient(145deg,#1c3a42,#122a30);
    border:1px solid var(--line); box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  .top .who{flex:1; min-width:0}
  .top .who b{font-size:.95rem; font-weight:700; letter-spacing:.2px}
  .top .who small{display:block; color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.7px}
  .bank{
    display:flex; align-items:baseline; gap:5px; padding:7px 12px; border-radius:999px;
    background:linear-gradient(145deg,#2a2008,#1a1607); border:1px solid var(--gold-deep);
    color:var(--gold); font-weight:800; font-variant-numeric:tabular-nums;
  }
  .bank small{font-size:.62rem; color:var(--gold-deep); text-transform:uppercase; letter-spacing:.6px; font-weight:700}

  /* demo ribbon */
  .ribbon{
    margin:12px 0 4px; padding:9px 13px; border-radius:12px; font-size:.78rem; line-height:1.35;
    background:rgba(245,184,61,.08); border:1px dashed rgba(245,184,61,.35); color:#e9cd8e;
  }
  .ribbon b{color:var(--gold)}

  /* tabs */
  .tabs{display:flex; gap:6px; margin:14px 0 10px; background:var(--bg2); padding:5px; border-radius:14px; border:1px solid var(--line)}
  .tabs button{
    flex:1; font-family:inherit; font-size:.82rem; font-weight:700; letter-spacing:.3px;
    padding:9px 8px; border:0; border-radius:10px; color:var(--muted); background:transparent; cursor:pointer;
    text-transform:uppercase; transition:.18s;
  }
  .tabs button.on{background:linear-gradient(145deg,#1e3b43,#16313800); color:var(--ink); box-shadow:0 1px 0 rgba(255,255,255,.06)}

  /* filter chips */
  .filters{display:flex; gap:7px; margin:4px 0 14px; overflow-x:auto; padding-bottom:2px}
  .filters button{
    flex:none; font-family:inherit; font-size:.76rem; font-weight:600; padding:7px 13px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer;
  }
  .filters button.on{background:var(--ink); color:#0B1A1F; border-color:var(--ink); font-weight:700}

  /* match card */
  .match{
    background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--line);
    border-radius:18px; padding:15px 15px 13px; margin-bottom:14px;
    box-shadow:0 10px 26px rgba(0,0,0,.28);
  }
  .mhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px}
  .stage{font-size:.66rem; text-transform:uppercase; letter-spacing:.9px; color:var(--muted); font-weight:700}
  .state{font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.6px; padding:3px 9px; border-radius:999px}
  .state.scheduled{color:#cfe0dd; background:#1c343b; border:1px solid var(--line)}
  .state.finished{color:#0B1A1F; background:var(--good)}
  .state.live{color:#fff; background:var(--surprise)}
  .state.live::before{content:"●"; margin-right:4px; animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.state.live::before{animation:none}}

  .teams{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin:4px 0 12px}
  .team{display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center}
  .flag{font-size:2.1rem; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
  .tname{font-size:.82rem; font-weight:700; text-wrap:balance}
  .vs{font-size:.8rem; color:var(--muted); font-weight:700}
  .score{font-size:1.9rem; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:1px}
  .score .g{color:var(--gold)}

  /* difficulty bar */
  .diff{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:12px}
  .dchip{
    border-radius:11px; padding:7px 6px; text-align:center; border:1px solid var(--line); background:#0e2228;
  }
  .dchip .dk{font-size:.62rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700}
  .dchip .dv{font-size:.95rem; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums}
  .dchip.fav .dv{color:var(--fav)} .dchip.even .dv{color:var(--even)} .dchip.surprise .dv{color:var(--surprise)}
  .dchip .dt{font-size:.58rem; text-transform:uppercase; letter-spacing:.4px; margin-top:1px}
  .dchip.fav .dt{color:var(--fav)} .dchip.even .dt{color:var(--even)} .dchip.surprise .dt{color:var(--surprise)}

  /* prediction zone */
  .mypick{
    display:flex; align-items:center; gap:8px; font-size:.82rem; padding:9px 12px; border-radius:11px;
    background:rgba(63,220,151,.08); border:1px solid rgba(63,220,151,.25); color:#bff0d8; margin-bottom:9px;
  }
  .mypick b{color:#fff}
  .predbox{background:#0e2228; border:1px solid var(--line); border-radius:13px; padding:12px; margin-bottom:9px}
  .stepper{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin-bottom:10px}
  .stcol{display:flex; flex-direction:column; align-items:center; gap:7px}
  .stcol .sn{font-size:.74rem; color:var(--muted); font-weight:700}
  .stctl{display:flex; align-items:center; gap:10px}
  .stctl button{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--card2);
    color:var(--ink); font-size:1.2rem; font-weight:800; cursor:pointer; line-height:1;
  }
  .stctl .num{font-size:1.5rem; font-weight:800; min-width:24px; text-align:center; font-variant-numeric:tabular-nums}
  .stdash{font-size:1.4rem; color:var(--muted); font-weight:800}
  .preview{font-size:.74rem; color:var(--muted); text-align:center; margin-bottom:10px; line-height:1.5}
  .preview b{color:var(--gold)}

  /* buttons */
  .btn{
    font-family:inherit; font-weight:800; font-size:.86rem; letter-spacing:.3px; border:0; border-radius:12px;
    padding:11px 14px; cursor:pointer; width:100%; transition:transform .05s, filter .15s;
  }
  .btn:active{transform:scale(.985)}
  .btn.gold{background:linear-gradient(145deg,var(--gold),var(--gold-deep)); color:var(--gold-ink)}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:700}
  .btn.sm{padding:9px 12px; font-size:.8rem}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}

  /* challenges */
  .duel-h{display:flex; align-items:center; gap:7px; margin:13px 0 8px; font-size:.7rem; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:700}
  .duel-h::after{content:""; flex:1; height:1px; background:var(--line)}
  .duel{
    display:flex; align-items:center; gap:10px; padding:10px 11px; border-radius:12px;
    background:#0e2228; border:1px solid var(--line); margin-bottom:7px;
  }
  .duel .dinfo{flex:1; min-width:0; font-size:.78rem; line-height:1.4}
  .duel .dinfo small{color:var(--muted)}
  .duel .pill{font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; white-space:nowrap}
  .duel .who2{font-weight:700}
  .acc{font-family:inherit; font-weight:800; font-size:.74rem; border:0; border-radius:9px; padding:8px 11px; cursor:pointer; white-space:nowrap; background:linear-gradient(145deg,var(--gold),var(--gold-deep)); color:var(--gold-ink)}
  .tagwin{font-size:.74rem; font-weight:800; color:var(--good)}
  .taglose{font-size:.74rem; font-weight:800; color:var(--bad)}

  /* leaderboard */
  .lb{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px; background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--line); margin-bottom:9px}
  .lb.me{border-color:var(--gold-deep); box-shadow:0 0 0 1px rgba(245,184,61,.25)}
  .pos{width:30px; text-align:center; font-size:1.05rem; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums}
  .av{width:36px; height:36px; flex:none; border-radius:11px; display:grid; place-items:center; font-weight:800; font-size:.82rem; background:linear-gradient(145deg,#1c3a42,#122a30); border:1px solid var(--line)}
  .lb .nm{flex:1; font-weight:700; font-size:.9rem}
  .lb .nm small{display:block; color:var(--muted); font-size:.7rem; font-weight:600}
  .lb .pts{font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums}

  .empty{text-align:center; color:var(--muted); padding:40px 10px; font-size:.85rem}

  /* form inline (new challenge) */
  .cform{background:#0e2228; border:1px solid var(--line); border-radius:13px; padding:12px; margin-bottom:9px}
  .cform label{display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; margin:8px 0 5px}
  .seg{display:flex; gap:6px; flex-wrap:wrap}
  .seg button{flex:1; min-width:60px; font-family:inherit; font-size:.78rem; font-weight:700; padding:8px 6px; border-radius:9px; border:1px solid var(--line); background:var(--card2); color:var(--muted); cursor:pointer}
  .seg button.on{background:var(--ink); color:#0B1A1F; border-color:var(--ink)}
  .stake{width:100%; font-family:inherit; font-size:1rem; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--ink); margin-top:2px}
  select.scorer-sel{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
  .scorer-sel option, .scorer-sel optgroup{color:#10242a; background:#eaf2ef}
  .cmeta{font-size:.74rem; color:var(--muted); text-align:center; margin:9px 0; line-height:1.5}
  .cmeta b{color:var(--gold)}

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:84px; transform:translate(-50%,16px); z-index:60;
    max-width:400px; width:calc(100% - 36px); padding:13px 16px; border-radius:13px; text-align:center;
    background:#16313a; border:1px solid var(--gold-deep); color:var(--ink); font-size:.85rem; font-weight:600;
    box-shadow:0 14px 34px rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:.25s;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  .toast.big{font-size:.92rem}
  .toast b{color:var(--gold)}

  /* bottom action bar */
  .actionbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, var(--bg) 60%, transparent);
  }
  .actionbar .inner{max-width:460px; margin:0 auto}
  .reset{display:block; margin:10px auto 0; background:none; border:0; color:var(--muted); font-size:.74rem; text-decoration:underline; cursor:pointer; font-family:inherit}
</style>

<div class="phone">
  <div class="top">
    <div class="crest">⚽</div>
    <div class="who"><b>Porra del Mundial 2026</b><small id="meName">Tú · liga global</small></div>
    <div class="bank"><span id="bank">1.000</span><small>pts</small></div>
  </div>

  <div class="ribbon">Esto es una <b>demo</b> con datos de ejemplo (sin conexión). Pronostica un marcador, lanza un <b>reto 1v1</b> a un amigo y pulsa <b>“Simular resultado”</b> para ver cómo se reparten los puntos — más cuanto mayor es la sorpresa.</div>

  <div class="tabs">
    <button id="tabMatchesBtn" class="on" onclick="setTab('matches')">Partidos</button>
    <button id="tabRankBtn" onclick="setTab('rank')">Clasificación</button>
  </div>

  <div id="viewMatches">
    <div class="filters">
      <button class="on" data-f="next" onclick="setFilter('next',this)">Próximos</button>
      <button data-f="done" onclick="setFilter('done',this)">Finalizados</button>
    </div>
    <div id="matchList"></div>
  </div>

  <div id="viewRank" style="display:none"></div>
</div>

<div class="actionbar" id="actionbar"><div class="inner">
  <button class="reset" onclick="resetDemo()">↺ Reiniciar demo</button>
</div></div>

<div class="toast" id="toast"></div>

/* ---------- modelo (idéntico al spec) ---------- */
function probs(ra, rb){
  const ea = 1/(1+Math.pow(10,(rb-ra)/400));
  let pd = 0.30*(1-2*Math.abs(ea-0.5)); if(pd<0) pd=0;
  return { a:(1-pd)*ea, d:pd, b:(1-pd)*(1-ea) };
}

/* Cuotas estilo casa de apuestas: prob del modelo + margen (~6%).
   En PRODUCCIÓN estas cuotas se sustituyen por las reales de una API de odds. */
const MARGIN = 0.94;
function book(fair){ return Math.max(1.05, Math.round(fair*MARGIN*100)/100); }
function pois(k,l){ let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; }
function lambdas(m){
  const d=((STR[m.a]||1500)-(STR[m.b]||1500))/100;
  return { la:Math.min(3.4,Math.max(0.3,1.35+0.18*d)), lb:Math.min(3.4,Math.max(0.3,1.35-0.18*d)) };
}
function suggestOdds(m, mk, sel, line, p){
  if(mk==="1x2"){ const pp=sel==="1"?p.a:sel==="X"?p.d:p.b; return book(1/Math.max(pp,.03)); }
  const {la,lb}=lambdas(m);
  if(mk==="ou"){ const L=line||2.5, tot=la+lb; let under=0; for(let k=0;k<=Math.floor(L);k++) under+=pois(k,tot);
    return book(1/Math.max(sel==="over"?1-under:under,.03)); }
  if(mk==="btts"){ const yes=(1-Math.exp(-la))*(1-Math.exp(-lb)); return book(1/Math.max(sel==="si"?yes:1-yes,.03)); }
  if(mk==="oddeven"){ return book(2.0); }   // ~50/50
  if(mk==="exact"){ const [x,y]=String(sel).split("-").map(Number); return book(1/Math.max(pois(x,la)*pois(y,lb),.004)); }
  if(mk==="scorer"){ const team=(PLAYERS[m.a]||[]).includes(sel)?m.a:m.b; const lt=team===m.a?la:lb;
    return book(1/Math.max(1-Math.exp(-lt/6),.05)); }
  return 1.90;
}
function startChallenge(id){ creating={id, market:"1x2", sel:"1", stake:50, line:2.5, exa:1, exb:0, max:3}; render(); }
function setMax(n){ creating.max=n; render(); }

function postChallenge(id){
  const m=S.matches.find(x=>x.id===id);
  if(creating.stake>S.me.pts){ toast("No tienes tantos puntos", false); return; }
  const p=matchProbs(m); const mk=creating.market;
  const sel = mk==="exact" ? `${creating.exa}-${creating.exb}` : creating.sel;
  const line = creating.line;
  const odds = suggestOdds(m, mk, sel, line, p);
  S.me.pts -= creating.stake;
  const ch={ id:++S.seq, match:id, by:"Tú", mine:true, market:mk, sel, line, odds, stake:creating.stake, max:creating.max, status:"open", takers:[] };
  S.challenges.push(ch); creating=null; render();
  toast("Reto publicado ⚔️ — lo pueden aceptar varios");
  setTimeout(()=>{ addFriendTaker(ch, S.friends[0].name); render(); toast(`<b>${S.friends[0].name}</b> ha aceptado tu reto`); }, 1200);
  setTimeout(()=>{ addFriendTaker(ch, S.friends[2].name); render(); toast(`<b>${S.friends[2].name}</b> también lo ha aceptado`); }, 2600);
}
function matchStarted(m){ return m.status!=="scheduled"; }
function addFriendTaker(ch, name){
  if(ch.status!=="open" || ch.takers.some(t=>t.name===name)) return;
  if(ch.max && ch.takers.length>=ch.max) return;  // cupo lleno
  if(ch.mine && ch.takers.length>=1){            // exposición extra del creador por cada rival adicional
    if(S.me.pts < ch.stake) return;              // no puede cubrir otro rival
    S.me.pts -= ch.stake;
  }
  ch.takers.push({name, mine:false});
}
function challengesFor(m){
  const list = S.challenges.filter(c=>c.match===m.id && c.status!=="void");
  if(!list.length) return "";
  const started = matchStarted(m);
  return `<div class="duel-h">Retos</div>` + list.map(c=>{
    const L = Math.round(c.stake*(c.odds-1));
    const iAccepted = c.takers.some(t=>t.mine);
    const full = c.max && c.takers.length>=c.max;
    const cupo = `${c.takers.length}${c.max?`/${c.max}`:""}`;
    const names = c.takers.length ? ` (${c.takers.map(t=>t.mine?"Tú":t.name).join(", ")})` : "";
    let action;
    if(c.status==="resolved"){
      if(c.mine) action = c.creatorWon ? `<span class="tagwin">ganaste ×${c.takers.length}</span>` : `<span class="taglose">perdiste</span>`;
      else if(iAccepted) action = (!c.creatorWon) ? `<span class="tagwin">ganaste</span>` : `<span class="taglose">perdiste</span>`;
      else action = `<small>resuelto</small>`;
    } else if(c.mine){
      action = `<span class="who2" style="font-size:.72rem;color:var(--muted)">tu reto · ${cupo} rivales</span>`;
    } else if(iAccepted){
      action = `<span class="who2" style="font-size:.72rem;color:var(--good)">aceptado ✓</span>`;
    } else if(started){
      action = `<small>cerrado</small>`;
    } else if(full){
      action = `<small style="color:var(--surprise)">completo</small>`;
    } else {
      action = `<button class="acc" onclick="accept(${c.id})">Aceptar · arriesgas ${fmt(L)}</button>`;
    }
    return `<div class="duel">
      <span class="dinfo"><b>${c.by}${c.mine?" (tú)":""}</b>: ${MK_LABEL[c.market]} · <b>${selName(m,c.market,c.sel,c.line)}</b><br>
        <small>cuota ×${c.odds.toFixed(2)} · rivales ${cupo}${names}</small></span>
      <span class="pill">${fmt(c.stake)} pts</span>
      ${action}
    </div>`;
  }).join("");
}
function accept(id){
  const c=S.challenges.find(x=>x.id===id);
  if(c.mine){ toast("Es tu propio reto"); return; }
  if(c.takers.some(t=>t.mine)){ toast("Ya lo aceptaste"); return; }
  if(c.max && c.takers.length>=c.max){ toast("Reto completo"); return; }
  const liab=Math.round(c.stake*(c.odds-1));
  if(liab>S.me.pts){ toast("No tienes puntos para cubrir el reto"); return; }
  S.me.pts -= liab; c.takers.push({name:"Tú", mine:true}); render();
  toast(`Reto aceptado ⚔️ — arriesgas <b>${fmt(liab)}</b> contra ${c.by}`);
}

/* ----- simular resultado ----- */
function weightedScore(p){
  const r=Math.random(); let out;
  if(r<p.a) out="1"; else if(r<p.a+p.d) out="X"; else out="2";
  const base=[[1,0],[2,0],[2,1],[3,1],[1,1],[0,0],[2,2],[3,0]];
  let a,b;
  if(out==="X"){ const dr=[[0,0],[1,1],[2,2]][Math.floor(Math.random()*3)]; a=dr[0]; b=dr[1]; }
  else { const sc=base[Math.floor(Math.random()*4)]; const hi=Math.max(sc[0],sc[1]), lo=Math.min(sc[0],sc[1]);
    if(out==="1"){ a=hi; b=lo; } else { a=lo; b=hi; } }
  return {a,b,out};
}
function genScorers(m, a, b){
  const out=[], ra=PLAYERS[m.a]||[m.a], rb=PLAYERS[m.b]||[m.b];
  for(let i=0;i<a;i++) out.push(ra[Math.floor(Math.random()*ra.length)]);
  for(let i=0;i<b;i++) out.push(rb[Math.floor(Math.random()*rb.length)]);
  return out;
}
function simulate(id){
  const m=S.matches.find(x=>x.id===id); const p=matchProbs(m);
  const r=weightedScore(p);
  m.status="finished"; m.sa=r.a; m.sb=r.b;
  m.scorers = genScorers(m, r.a, r.b);
  const realOut = r.a>r.b?"1":r.a<r.b?"2":"X";
  const pReal = realOut==="1"?p.a:realOut==="2"?p.b:p.d;
  const f = factor(pReal);
  let summary = `${FLAG[m.a]} ${m.a} <b>${r.a}-${r.b}</b> ${m.b} ${FLAG[m.b]}`;
  if(m.scorers.length) summary += `<br><span style="opacity:.72">⚽ ${m.scorers.join(", ")}</span>`;

  // porra: yo
  if(m.mypred){
    const exact = m.mypred.a===r.a && m.mypred.b===r.b;
    const win = Math.sign(m.mypred.a-m.mypred.b)===Math.sign(r.a-r.b);
    m.mypts = exact ? PTS_EXACT*f : win ? PTS_WINNER*f : 0;
    S.me.pts += m.mypts;
    summary += m.mypts>0 ? `<br>Tu ${m.mypred.a}-${m.mypred.b}: <b>+${fmt(m.mypts)} pts</b> ${exact?"🎯 exacto":"✅ ganador"} ${f>1?`(${dlabel(pReal)} ×${f})`:""}` : `<br>Tu ${m.mypred.a}-${m.mypred.b}: <b>+0</b>, fallaste`;
  }
  // porra: amigos (simulado, para que la clasificación se mueva)
  S.friends.forEach(fr=>{ const roll=Math.random(); fr.pts += roll<0.18 ? PTS_EXACT*f : roll<0.55 ? PTS_WINNER*f : 0; });

  // retos de este partido (1 contra varios)
  S.challenges.filter(c=>c.match===id && c.status==="open").forEach(c=>{
    if(c.takers.length===0){ if(c.mine) S.me.pts += c.stake; c.status="void"; return; }  // nadie aceptó
    const creatorWon = challengeWins(c.market, c.sel, r.a, r.b, c.line, m.scorers);
    const L = Math.round(c.stake*(c.odds-1));
    const n = c.takers.length;
    c.status="resolved"; c.creatorWon=creatorWon;
    const lab = selName(m,c.market,c.sel,c.line);
    if(c.mine){
      if(creatorWon){ S.me.pts += n*c.stake + n*L; summary+=`<br>Tu reto (${lab}): <b>ganaste +${fmt(n*L)}</b> a ${n} rival(es) ⚔️`; }
      else { summary+=`<br>Tu reto (${lab}): <b>perdiste ${fmt(n*c.stake)}</b>`; }
    } else {
      if(c.takers.some(t=>t.mine)){
        if(!creatorWon){ S.me.pts += L + c.stake; summary+=`<br>Reto de ${c.by} (${lab}): <b>ganaste +${fmt(c.stake)}</b> ⚔️`; }
        else { summary+=`<br>Reto de ${c.by} (${lab}): <b>perdiste ${fmt(L)}</b>`; }
      }
      const fr=S.friends.find(f=>f.name===c.by);          // sabor: balance del amigo creador
      if(fr) fr.pts += creatorWon ? n*L : -n*c.stake;
    }
    c.takers.filter(t=>!t.mine).forEach(t=>{ const fr=S.friends.find(f=>f.name===t.name); if(fr) fr.pts += creatorWon ? -L : c.stake; });
  });

  render(); toast(summary, true);
}
function challengeWins(mk, sel, a, b, line, scorers){
  switch(mk){
    case "1x2":  return (a>b?"1":a<b?"2":"X")===sel;
    case "ou":   return sel==="over" ? (a+b)>(line||2.5) : (a+b)<(line||2.5);
    case "btts": return ((a>0&&b>0)?"si":"no")===sel;
    case "oddeven": return (((a+b)%2===0)?"par":"impar")===sel;
    case "exact": { const [x,y]=String(sel).split("-").map(Number); return a===x&&b===y; }
    case "scorer": return (scorers||[]).includes(sel);
    default: return false;
  }
}

/* ----- ranking ----- */
function renderRank(){
  const all=[{name:S.me.name,pts:S.me.pts,me:true}, ...S.friends.map(f=>({name:f.name,pts:f.pts}))]
    .sort((x,y)=>y.pts-x.pts);
  $("viewRank").innerHTML = all.map((p,i)=>`
    <div class="lb ${p.me?'me':''}">
      <span class="pos">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span>
      <span class="av">${ini(p.name)}</span>
      <span class="nm">${p.name}${p.me?' <small>tú</small>':''}</span>
      <span class="pts">${fmt(p.pts)} pts</span>
    </div>`).join("");
}

function resetDemo(){ S=fresh(); editing=null; creating=null; setTab("matches"); toast("Demo reiniciada ↺"); }

render();
