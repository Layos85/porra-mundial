<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>Mi Seguimiento</title>
<style>
  :root{
    --bg:#0b1220; --card:#131c2e; --card2:#1b2840;
    --txt:#e8eef7; --muted:#9fb0c8;
    --smoke:#f59e0b; --drink:#38bdf8; --consume:#c084fc; --climb:#34d399;
    --good:#34d399; --bad:#f87171;
    --line:#26344f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#0b1220,#0d1730); color:var(--txt);
    min-height:100vh; padding:18px 14px 40px;
  }
  header{text-align:center; margin:6px 0 22px}
  header h1{font-size:1.35rem; margin:0 0 4px; font-weight:700}
  header p{margin:0; color:var(--muted); font-size:.85rem}
  .wrap{max-width:560px; margin:0 auto}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:20px; margin-bottom:18px; box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .card .top{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .icon{font-size:1.6rem}
  .card h2{font-size:1.05rem; margin:0; font-weight:600}
  .days{font-size:3.4rem; font-weight:800; line-height:1; margin:10px 0 2px}
  .days small{font-size:1rem; font-weight:600; color:var(--muted)}
  .sub{color:var(--muted); font-size:.85rem; margin:2px 0 14px}
  .smoke .days,.smoke .icon{color:var(--smoke)}
  .drink .days,.drink .icon{color:var(--drink)}
  .consume .days,.consume .icon{color:var(--consume)}
  .climb .days,.climb .icon{color:var(--climb)}
  .stats{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap}
  .stat{
    flex:1; min-width:100px; background:var(--card2); border-radius:12px;
    padding:10px 12px; border:1px solid var(--line);
  }
  .stat .v{font-size:1.15rem; font-weight:700}
  .stat .l{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.4px}
  .btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  button{
    font-family:inherit; font-size:.92rem; font-weight:600; border:none;
    border-radius:12px; padding:11px 14px; cursor:pointer; color:#fff;
    transition:transform .05s, opacity .2s;
  }
  button:active{transform:scale(.97)}
  .btn-relapse{background:var(--bad); flex:1}
  .btn-add{background:var(--climb); flex:1; color:#06281c}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--muted)}
  .milestone{
    margin-top:14px; padding:10px 12px; border-radius:12px; font-size:.85rem;
    background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.3); color:var(--good);
  }
  .start-row{display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap}
  .start-row label{font-size:.8rem; color:var(--muted)}
  input{
    background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:8px 10px; font-family:inherit; font-size:.85rem;
  }
  .note{text-align:center; color:var(--muted); font-size:.75rem; margin-top:8px}
  .climblist{margin-top:12px; display:flex; flex-direction:column; gap:6px}
  .climbrow{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card2); border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; font-size:.85rem;
  }
  .climbrow button{background:transparent; color:var(--bad); padding:2px 8px; font-size:1.1rem}
  .empty{color:var(--muted); font-size:.82rem; text-align:center; padding:8px}
  dialog{
    border:none; border-radius:16px; background:var(--card); color:var(--txt);
    padding:22px; max-width:340px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h3{margin:0 0 10px}
  dialog p{color:var(--muted); font-size:.88rem; line-height:1.45}
  .dlg-btns{display:flex; gap:10px; margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌱 Mi Seguimiento</h1>
    <p>Tus rachas y tus días de escalada · día a día</p>
  </header>

  <div id="streaks"></div>

  <!-- ESCALADA (registro) -->
  <section class="card climb">
    <div class="top"><span class="icon">🧗‍♀️</span><h2>Días escalados</h2></div>
    <div class="days" id="climb-total">0 <small>días</small></div>
    <div class="sub" id="climb-sub"></div>
    <div class="stats">
      <div class="stat"><div class="v" id="climb-month">0</div><div class="l">Este mes</div></div>
      <div class="stat"><div class="v" id="climb-year">0</div><div class="l">Este año</div></div>
      <div class="stat"><div class="v" id="climb-last">–</div><div class="l">Última vez</div></div>
    </div>
    <div class="btns">
      <button class="btn-add" onclick="climbToday()">🧗 Hoy he escalado</button>
      <button class="btn-ghost" onclick="document.getElementById('climb-date').showPicker?.();document.getElementById('climb-date').focus()">📅 Otra fecha</button>
    </div>
    <div class="start-row" style="margin-top:10px">
      <input type="date" id="climb-date" onchange="climbAdd(this.value)">
      <span style="font-size:.75rem;color:var(--muted)">Elige una fecha para apuntarla</span>
    </div>
    <div class="climblist" id="climb-list"></div>
  </section>

  <p class="note">Tus datos se guardan solo en este dispositivo. Guarda esta página en favoritos o en la pantalla de inicio del móvil.</p>
</div>

<!-- DIALOGO AJUSTES (rachas) -->
<dialog id="dlg">
  <h3 id="dlg-title">Ajustes</h3>
  <div class="start-row">
    <label>Empecé el día / hora:</label>
    <input type="datetime-local" id="dlg-date">
  </div>
  <div class="start-row">
    <label id="dlg-price-label">Coste por unidad (€):</label>
    <input type="number" id="dlg-price" min="0" step="0.1" style="width:90px">
  </div>
  <div class="start-row">
    <label id="dlg-qty-label">Unidades al día antes:</label>
    <input type="number" id="dlg-qty" min="0" step="1" style="width:90px">
  </div>
  <p id="dlg-help"></p>
  <div class="dlg-btns">
    <button class="btn-relapse" style="background:var(--good)" onclick="saveSettings()">Guardar</button>
    <button class="btn-ghost" onclick="document.getElementById('dlg').close()">Cancelar</button>
  </div>
</dialog>

<script>
const DAY = 86400000;

// --- Rachas (días SIN algo) ---
const STREAKS = {
  smoke:  { icon:'🚭', label:'Sin fumar',   unit:'cigarrillos', statLabel:'No fumados',
            priceLabel:'Coste por cigarrillo (€):', qtyLabel:'Cigarrillos al día antes:',
            defPrice:0.25, defQty:20,
            help:'Pon cuánto te costaba un cigarrillo y cuántos fumabas al día para calcular el ahorro.' },
  drink:  { icon:'🍺', label:'Sin beber',   unit:'bebidas', statLabel:'No tomadas',
            priceLabel:'Coste por bebida (€):', qtyLabel:'Bebidas al día antes:',
            defPrice:2.5, defQty:2,
            help:'Pon cuánto te costaba una bebida y cuántas tomabas al día de media.' },
  consume:{ icon:'🚫', label:'Sin consumir', unit:'veces', statLabel:'No consumido',
            priceLabel:'Coste por vez (€):', qtyLabel:'Veces al día antes:',
            defPrice:0, defQty:0,
            help:'Si quieres calcular el ahorro, pon cuánto te costaba y con qué frecuencia. Si no, déjalo en 0.' }
};

function load(){ try{ return JSON.parse(localStorage.getItem('habitos')||'{}'); }catch(e){ return {}; } }
function save(s){ localStorage.setItem('habitos', JSON.stringify(s)); }

function ensure(key){
  const s = load();
  if(!s[key]){
    s[key] = { start: Date.now(), best:0, price:STREAKS[key].defPrice, qty:STREAKS[key].defQty };
    save(s);
  }
  return s[key];
}

function fmtDur(ms){
  const totalMin = Math.floor(ms/60000);
  return { d:Math.floor(totalMin/1440), h:Math.floor((totalMin%1440)/60), m:totalMin%60 };
}

function milestoneText(days){
  const ms = [1,3,7,14,30,60,90,180,365,730];
  for(let i=ms.length-1;i>=0;i--){
    if(days>=ms[i]){
      const next = ms[i+1];
      let t = '🎉 ¡Has superado los '+ms[i]+' día'+(ms[i]>1?'s':'')+'!';
      if(next) t += ' Próxima meta: '+next+' días.';
      return t;
    }
  }
  return null;
}

// Construye las tarjetas de racha
function buildStreaks(){
  const cont = document.getElementById('streaks');
  cont.innerHTML = '';
  Object.keys(STREAKS).forEach(key=>{
    ensure(key);
    const c = STREAKS[key];
    const sec = document.createElement('section');
    sec.className = 'card '+key;
    sec.innerHTML = `
      <div class="top"><span class="icon">${c.icon}</span><h2>${c.label}</h2></div>
      <div class="days" id="d-${key}">–</div>
      <div class="sub" id="sub-${key}"></div>
      <div class="stats">
        <div class="stat"><div class="v" id="best-${key}">–</div><div class="l">Mejor racha</div></div>
        <div class="stat"><div class="v" id="money-${key}">–</div><div class="l">Ahorrado</div></div>
        <div class="stat"><div class="v" id="units-${key}">–</div><div class="l">${c.statLabel}</div></div>
      </div>
      <div class="milestone" id="mile-${key}" style="display:none"></div>
      <div class="btns">
        <button class="btn-relapse" onclick="relapse('${key}')">Reinicié hoy 😔</button>
        <button class="btn-ghost" onclick="openSettings('${key}')">⚙️ Ajustes</button>
      </div>`;
    cont.appendChild(sec);
  });
}

function renderStreaks(){
  const s = load();
  Object.keys(STREAKS).forEach(key=>{
    const d = s[key]; if(!d) return;
    const elapsed = Date.now() - d.start;
    const {d:days,h,m} = fmtDur(elapsed);
    document.getElementById('d-'+key).innerHTML = days+' <small>día'+(days!==1?'s':'')+'</small>';
    document.getElementById('sub-'+key).textContent =
      'y '+h+' h '+m+' min · desde el '+new Date(d.start).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
    document.getElementById('best-'+key).textContent = Math.max(d.best||0, days)+' días';

    const daysFloat = elapsed/DAY;
    const money = daysFloat * (d.qty||0) * (d.price||0);
    document.getElementById('money-'+key).textContent =
      money.toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:2})+' €';
    document.getElementById('units-'+key).textContent = Math.floor(daysFloat * (d.qty||0));

    const mt = milestoneText(days);
    const mEl = document.getElementById('mile-'+key);
    if(mt){ mEl.style.display='block'; mEl.textContent = mt; } else mEl.style.display='none';
  });
}

function relapse(key){
  if(!confirm('¿Seguro que quieres reiniciar el contador de "'+STREAKS[key].label+'"?\n\nGuardaremos tu mejor racha. Mañana es un nuevo comienzo. 💪')) return;
  const s = load();
  const days = Math.floor((Date.now()-s[key].start)/DAY);
  s[key].best = Math.max(s[key].best||0, days);
  s[key].start = Date.now();
  save(s);
  renderStreaks();
}

// --- Ajustes (rachas) ---
let current=null;
function openSettings(key){
  current=key;
  const d = ensure(key);
  document.getElementById('dlg-title').textContent = 'Ajustes · '+STREAKS[key].label;
  document.getElementById('dlg-price-label').textContent = STREAKS[key].priceLabel;
  document.getElementById('dlg-qty-label').textContent = STREAKS[key].qtyLabel;
  document.getElementById('dlg-help').textContent = STREAKS[key].help;
  const dt = new Date(d.start - new Date().getTimezoneOffset()*60000);
  document.getElementById('dlg-date').value = dt.toISOString().slice(0,16);
  document.getElementById('dlg-price').value = d.price;
  document.getElementById('dlg-qty').value = d.qty;
  document.getElementById('dlg').showModal();
}
function saveSettings(){
  const s = load(), key = current;
  const dateVal = document.getElementById('dlg-date').value;
  if(dateVal) s[key].start = new Date(dateVal).getTime();
  s[key].price = parseFloat(document.getElementById('dlg-price').value)||0;
  s[key].qty = parseFloat(document.getElementById('dlg-qty').value)||0;
  save(s);
  document.getElementById('dlg').close();
  renderStreaks();
}

// --- Escalada (registro de días) ---
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function climbList(){
  const s = load();
  return Array.isArray(s.climb) ? s.climb : [];
}
function climbToday(){ climbAdd(todayStr()); }
function climbAdd(dateStr){
  if(!dateStr) return;
  const s = load();
  if(!Array.isArray(s.climb)) s.climb = [];
  if(s.climb.includes(dateStr)){ alert('Ese día ya está apuntado 🙂'); return; }
  s.climb.push(dateStr);
  s.climb.sort().reverse();
  save(s);
  renderClimb();
}
function climbRemove(dateStr){
  const s = load();
  s.climb = (s.climb||[]).filter(x=>x!==dateStr);
  save(s);
  renderClimb();
}
function renderClimb(){
  const list = climbList();
  const now = new Date();
  const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const y = String(now.getFullYear());
  document.getElementById('climb-total').innerHTML = list.length+' <small>día'+(list.length!==1?'s':'')+'</small>';
  document.getElementById('climb-month').textContent = list.filter(d=>d.startsWith(ym)).length;
  document.getElementById('climb-year').textContent  = list.filter(d=>d.startsWith(y)).length;

  if(list.length){
    const last = list[0];
    const lastD = new Date(last+'T00:00:00');
    const diffDays = Math.round((new Date(todayStr()+'T00:00:00') - lastD)/DAY);
    let txt = lastD.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
    document.getElementById('climb-last').textContent = txt;
    document.getElementById('climb-sub').textContent =
      diffDays===0 ? '¡Hoy has escalado! 💪' : 'Hace '+diffDays+' día'+(diffDays!==1?'s':'')+' que escalaste';
  } else {
    document.getElementById('climb-last').textContent = '–';
    document.getElementById('climb-sub').textContent = 'Apunta tu primer día de escalada 🧗';
  }

  const ul = document.getElementById('climb-list');
  if(!list.length){ ul.innerHTML = '<div class="empty">Aún no hay días apuntados.</div>'; return; }
  ul.innerHTML = list.slice(0,12).map(d=>{
    const dd = new Date(d+'T00:00:00');
    const label = dd.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
    return `<div class="climbrow"><span>🧗 ${label}</span><button title="Borrar" onclick="climbRemove('${d}')">✕</button></div>`;
  }).join('') + (list.length>12 ? `<div class="empty">…y ${list.length-12} más</div>` : '');
}

// init
buildStreaks();
renderStreaks();
renderClimb();
setInterval(renderStreaks, 60000);
</script>
</body>
</html>
